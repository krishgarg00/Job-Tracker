<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobVault - Resume Information</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 72px;
        }

        main {
            flex: 1;
            padding: 50px 0;
        }

        .navbar {
            min-height: 72px;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1030;
            background: #000 !important;
        }

        .navbar-brand {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-link {
            font-size: 14px;
            margin: 0 7px;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .navbar .btn {
            border-radius: 8px;
        }

        .resume-form-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 40px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #777;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #000;
            box-shadow: 0 0 0 0.15rem rgba(0, 0, 0, 0.08);
        }

        .section-divider {
            margin: 35px 0;
            border-color: #ddd;
        }

        .btn-dark {
            border-radius: 8px;
            padding: 10px 25px;
        }

        .entry-card {
            background: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        footer {
            background: #000;
            color: white;
            padding: 35px 0 20px;
        }

        .footer-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .footer-text {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            main {
                padding: 30px 0;
            }

            .resume-form-card {
                padding: 25px 18px;
            }

            .page-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                JobVault
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link text-white" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="applications.html">
                            Applications
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white active" href="resume_builder.html">
                            Resume Builder
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="home.html">
                            Dashboard
                        </a>
                    </li>

                </ul>

                <div class="d-flex">

                    <button class="btn btn-outline-light btn-sm px-3" onclick="handleLogout()">
                        Logout
                    </button>

                </div>

            </div>

        </div>

    </nav>

    <main>

        <div class="container">

            <div class="mb-4">

                <h1 class="page-title">
                    Resume Information
                </h1>

                <p class="page-subtitle">
                    Enter your information to create your professional resume.
                </p>

            </div>

            <div class="card resume-form-card shadow-sm">

                <form id="resumeForm">

                    <div>

                        <h2 class="section-title">
                            Personal Information
                        </h2>

                        <!-- Resume Title -->
                        <div class="mb-3">
                            <label for="resumeTitle" class="form-label">
                                Resume Title
                            </label>
                            <input type="text" id="resumeTitle" class="form-control"
                                placeholder="e.g. MERN Stack Developer Resume" value="My Resume" required>
                        </div>


                        <div class="row g-3">

                            <div class="col-12">

                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name"
                                    required>

                            </div>

                            <div class="col-md-6">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                    required>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone Numbers
                                </label>

                                <div id="phoneContainer"></div>

                                <button type="button" class="btn btn-outline-dark btn-sm mt-2" onclick="addPhone()">
                                    + Add Phone
                                </button>

                            </div>

                            <div class="col-12">

                                <label for="linkedin" class="form-label">
                                    LinkedIn
                                </label>

                                <input type="url" id="linkedin" class="form-control"
                                    placeholder="https://linkedin.com/in/your-profile">

                            </div>

                        </div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Education
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addEducation()">
                                + Add Education
                            </button>

                        </div>

                        <div id="educationContainer"></div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Experience
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addExperience()">
                                + Add Experience
                            </button>

                        </div>

                        <div id="experienceContainer"></div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Skills
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addSkill()">
                                + Add Skill
                            </button>

                        </div>

                        <div id="skillsContainer"></div>

                    </div>

                    <hr class="section-divider">

                    <div>

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h2 class="section-title mb-0">
                                Projects
                            </h2>

                            <button type="button" class="btn btn-outline-dark btn-sm" onclick="addProject()">
                                + Add Project
                            </button>

                        </div>

                        <div id="projectsContainer"></div>

                    </div>

                    <div class="d-flex justify-content-end mt-4">

                        <button type="submit" class="btn btn-dark">
                            Update Resume
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

    <footer>

        <div class="container">

            <div class="footer-brand">
                JobVault
            </div>

            <div class="footer-text">
                Build your professional resume with JobVault.
            </div>

        </div>

    </footer>



    <script>
        // =========================
        // 1. LOGIN CHECK
        // =========================
        const currentUser = JSON.parse(
            sessionStorage.getItem("currentUser") || "null"
        );

        const isLoggedIn = sessionStorage.getItem("isLoggedIn");
        const API_URL = "http://localhost:5000/api/resumes";

        if (isLoggedIn !== "true" || !currentUser) {
            window.location.href = "login.html";
        }

        // =========================
        // 2. FORM CONTAINERS
        // =========================
        const phoneContainer = document.getElementById("phoneContainer");
        const educationContainer = document.getElementById("educationContainer");
        const experienceContainer = document.getElementById("experienceContainer");
        const skillsContainer = document.getElementById("skillsContainer");
        const projectsContainer = document.getElementById("projectsContainer");

        // =========================
        // 3. HELPER FUNCTIONS
        // =========================
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function addPhone(value = "") {
            const div = document.createElement("div");
            div.className = "input-group mb-2 phone-item";

            div.innerHTML = `
            <input type="tel"
                class="form-control phone-input"
                placeholder="Enter phone number"
                value="${escapeHtml(value)}"
                required>

            <button type="button"
                class="btn btn-outline-danger"
                onclick="removeItem(this)">
                Remove
            </button>
        `;

            phoneContainer.appendChild(div);
        }

        function addEducation(data = {}) {
            const div = document.createElement("div");
            div.className = "entry-card education-item";

            div.innerHTML = `
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">College / University</label>
                    <input type="text"
                        class="form-control education-college"
                        placeholder="Enter college or university"
                        value="${escapeHtml(data.college || "")}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Degree</label>
                    <input type="text"
                        class="form-control education-degree"
                        placeholder="e.g. B.Tech Computer Science"
                        value="${escapeHtml(data.degree || "")}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Graduation Year</label>
                    <input type="text"
                        class="form-control education-year"
                        placeholder="e.g. 2027"
                        value="${escapeHtml(data.graduationYear || "")}">
                </div>
            </div>

            <button type="button"
                class="btn btn-outline-danger btn-sm mt-3"
                onclick="removeItem(this)">
                Remove Education
            </button>
        `;

            educationContainer.appendChild(div);
        }

        function addExperience(data = {}) {
            const div = document.createElement("div");
            div.className = "entry-card experience-item";

            div.innerHTML = `
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Company</label>
                    <input type="text"
                        class="form-control experience-company"
                        placeholder="Enter company name"
                        value="${escapeHtml(data.company || "")}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Job Role</label>
                    <input type="text"
                        class="form-control experience-role"
                        placeholder="e.g. Software Developer"
                        value="${escapeHtml(data.jobRole || "")}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Duration</label>
                    <input type="text"
                        class="form-control experience-duration"
                        placeholder="e.g. Jan 2025 - Present"
                        value="${escapeHtml(data.duration || "")}">
                </div>
            </div>

            <button type="button"
                class="btn btn-outline-danger btn-sm mt-3"
                onclick="removeItem(this)">
                Remove Experience
            </button>
        `;

            experienceContainer.appendChild(div);
        }

        function addSkill(value = "") {
            const div = document.createElement("div");
            div.className = "input-group mb-2 skill-item";

            div.innerHTML = `
            <input type="text"
                class="form-control skill-input"
                placeholder="e.g. JavaScript"
                value="${escapeHtml(value)}"
                required>

            <button type="button"
                class="btn btn-outline-danger"
                onclick="removeItem(this)">
                Remove
            </button>
        `;

            skillsContainer.appendChild(div);
        }

        function addProject(data = {}) {
            const div = document.createElement("div");
            div.className = "entry-card project-item";

            div.innerHTML = `
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Project Name</label>
                    <input type="text"
                        class="form-control project-name"
                        placeholder="Enter project name"
                        value="${escapeHtml(data.name || "")}">
                </div>

                <div class="col-12">
                    <label class="form-label">Project Details</label>
                    <textarea
                        class="form-control project-details"
                        rows="3"
                        placeholder="Describe your project">${escapeHtml(data.details || "")}</textarea>
                </div>
            </div>

            <button type="button"
                class="btn btn-outline-danger btn-sm mt-3"
                onclick="removeItem(this)">
                Remove Project
            </button>
        `;

            projectsContainer.appendChild(div);
        }

        function removeItem(button) {
            const item = button.closest(
                ".phone-item, .education-item, .experience-item, .skill-item, .project-item"
            );

            if (item) {
                item.remove();
            }
        }

        // =========================
        // 4. CONVERT SAVED DATA
        // =========================
        function convertBackendResume(resume) {
            const personal = resume.personalInfo || {};

            return {
                title: resume.title || "My Resume",
                template: resume.template || "Template1",

                fullName: personal.fullName || "",
                email: personal.email || "",
                linkedin: personal.linkedin || "",

                phones: personal.phone
                    ? personal.phone.split(",").map(p => p.trim()).filter(Boolean)
                    : [],

                education: resume.education || [],
                experience: resume.experience || [],
                skillsList: resume.skills || [],
                projectList: resume.projects || []
            };
        }

        function convertLegacyData(data) {
            const result = { ...data };

            result.title = data.title || "My Resume";

            result.phones = data.phones ||
                (data.phone ? [data.phone] : []);

            result.education = data.education || [];

            if (
                !result.education.length &&
                (data.college || data.degree || data.graduationYear)
            ) {
                result.education = [{
                    college: data.college || "",
                    degree: data.degree || "",
                    graduationYear: data.graduationYear || ""
                }];
            }

            result.experience = data.experience || [];

            if (
                !result.experience.length &&
                (data.company || data.jobRole || data.experienceDuration)
            ) {
                result.experience = [{
                    company: data.company || "",
                    jobRole: data.jobRole || "",
                    duration: data.experienceDuration || ""
                }];
            }

            result.skillsList = data.skillsList ||
                (typeof data.skills === "string"
                    ? data.skills.split(",").map(s => s.trim()).filter(Boolean)
                    : []);

            result.projectList = data.projectList || [];

            if (!result.projectList.length && data.projects) {
                result.projectList = [{
                    name: "",
                    details: data.projects
                }];
            }

            return result;
        }

        // =========================
        // 5. DISPLAY DATA IN FORM
        // =========================
        function populateForm(data = {}) {
            const titleInput = document.getElementById("resumeTitle");

            if (titleInput) {
                titleInput.value = data.title || "My Resume";
            }

            document.getElementById("fullName").value = data.fullName || "";
            document.getElementById("email").value = data.email || "";
            document.getElementById("linkedin").value = data.linkedin || "";

            phoneContainer.innerHTML = "";
            educationContainer.innerHTML = "";
            experienceContainer.innerHTML = "";
            skillsContainer.innerHTML = "";
            projectsContainer.innerHTML = "";

            (data.phones || []).forEach(phone => addPhone(phone));
            (data.education || []).forEach(item => addEducation(item));
            (data.experience || []).forEach(item => addExperience(item));
            (data.skillsList || []).forEach(skill => addSkill(skill));
            (data.projectList || []).forEach(project => addProject(project));

            if (!phoneContainer.children.length) addPhone();
            if (!educationContainer.children.length) addEducation();
            if (!experienceContainer.children.length) addExperience();
            if (!skillsContainer.children.length) addSkill();
            if (!projectsContainer.children.length) addProject();
        }

        // =========================
        // 6. LOAD RESUME FROM MONGODB
        // =========================
        async function loadResumeFromBackend() {
            const token = sessionStorage.getItem("token");

            if (!token) {
                alert("Your login session has expired. Please log in again.");
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Could not load resumes.");
                }

                const resumes = Array.isArray(result.resumes)
                    ? result.resumes
                    : [];

                const savedResumeId =
                    sessionStorage.getItem("jobVaultResumeId");

                const resume =
                    resumes.find(item => item._id === savedResumeId) ||
                    resumes[0];

                if (resume) {
                    sessionStorage.setItem("jobVaultResumeId", resume._id);

                    const data = convertBackendResume(resume);

                    populateForm(data);

                    sessionStorage.setItem(
                        "selectedResumeTemplate",
                        resume.template || "Template1"
                    );

                    return;
                }

                // No saved resume: start with a clean form.
                // Do not load another account's shared local draft.
                sessionStorage.removeItem("jobVaultResumeId");
                sessionStorage.removeItem("selectedResumeTemplate");


                populateForm({ title: "My Resume" });

            } catch (error) {
                console.error("Resume loading error:", error);

                // Clear shared draft data to avoid showing stale information.

                sessionStorage.removeItem("jobVaultResumeId");
                sessionStorage.removeItem("selectedResumeTemplate");

                populateForm({ title: "My Resume" });

                alert(
                    "Could not load your resumes from the backend. " +
                    "The form has been cleared to avoid showing stale data. " +
                    "Please check your backend connection and try again."
                );
            }
        }

        // =========================
        // 7. COLLECT FORM DATA
        // =========================
        function collectResumeData() {
            const phones = [...document.querySelectorAll(".phone-input")]
                .map(input => input.value.trim())
                .filter(Boolean);

            const education = [...document.querySelectorAll(".education-item")]
                .map(item => ({
                    college: item.querySelector(".education-college").value.trim(),
                    degree: item.querySelector(".education-degree").value.trim(),
                    graduationYear: item.querySelector(".education-year").value.trim()
                }))
                .filter(item =>
                    item.college || item.degree || item.graduationYear
                );

            const experience = [...document.querySelectorAll(".experience-item")]
                .map(item => ({
                    company: item.querySelector(".experience-company").value.trim(),
                    jobRole: item.querySelector(".experience-role").value.trim(),
                    duration: item.querySelector(".experience-duration").value.trim()
                }))
                .filter(item =>
                    item.company || item.jobRole || item.duration
                );

            const skillsList = [...document.querySelectorAll(".skill-input")]
                .map(input => input.value.trim())
                .filter(Boolean);

            const projectList = [...document.querySelectorAll(".project-item")]
                .map(item => ({
                    name: item.querySelector(".project-name").value.trim(),
                    details: item.querySelector(".project-details").value.trim()
                }))
                .filter(item => item.name || item.details);

            return {
                title:
                    document.getElementById("resumeTitle").value.trim() ||
                    "My Resume",

                fullName: document.getElementById("fullName").value.trim(),
                email: document.getElementById("email").value.trim(),
                phones,
                linkedin: document.getElementById("linkedin").value.trim(),

                education,
                experience,
                skillsList,
                projectList,

                // Legacy fields used by existing template pages.
                phone: phones[0] || "",
                college: education[0]?.college || "",
                degree: education[0]?.degree || "",
                graduationYear: education[0]?.graduationYear || "",
                company: experience[0]?.company || "",
                jobRole: experience[0]?.jobRole || "",
                experienceDuration: experience[0]?.duration || "",
                skills: skillsList.join(", "),

                projects: projectList
                    .map(project =>
                        `${project.name}${project.details ? " - " + project.details : ""}`
                    )
                    .join("\n")
            };
        }

        // =========================
        // 8. SAVE RESUME TO MONGODB
        // =========================
        document.getElementById("resumeForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const token = sessionStorage.getItem("token");

                if (!token) {
                    alert("Please log in again.");
                    window.location.href = "login.html";
                    return;
                }

                const resumeData = collectResumeData();

                const payload = {
                    title: resumeData.title,
                    template:
                        sessionStorage.getItem("selectedResumeTemplate") ||
                        "Template1",

                    personalInfo: {
                        fullName: resumeData.fullName,
                        email: resumeData.email,
                        phone: resumeData.phones.join(", "),
                        linkedin: resumeData.linkedin
                    },

                    education: resumeData.education,
                    experience: resumeData.experience,
                    skills: resumeData.skillsList,
                    projects: resumeData.projectList
                };

                const resumeId =
                    sessionStorage.getItem("jobVaultResumeId");

                const isUpdating = Boolean(resumeId);

                const submitButton = document.querySelector(
                    '#resumeForm button[type="submit"]'
                );

                const originalButtonText = submitButton
                    ? submitButton.textContent
                    : "Save Resume";

                if (submitButton) {
                    submitButton.disabled = true;
                    submitButton.textContent = "Saving...";
                }

                try {
                    const response = await fetch(
                        isUpdating ? `${API_URL}/${resumeId}` : API_URL,
                        {
                            method: isUpdating ? "PUT" : "POST",

                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${token}`
                            },

                            body: JSON.stringify(payload)
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.message || "Failed to save resume."
                        );
                    }

                    if (result.resume?._id) {
                        sessionStorage.setItem(
                            "jobVaultResumeId",
                            result.resume._id
                        );
                    }

                    sessionStorage.setItem(
                        "selectedResumeTemplate",
                        payload.template
                    );

                    alert("Resume saved successfully!");

                    window.location.href = "template.html";

                } catch (error) {
                    console.error("Resume save error:", error);

                    alert(
                        "Could not save your resume to the backend. " +
                        "Please check your backend connection and try again."
                    );

                } finally {
                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.textContent = originalButtonText;
                    }
                }
            }
        );

        // =========================
        // 9. LOGOUT
        // =========================
        function handleLogout() {
            sessionStorage.removeItem("currentUser");
            sessionStorage.removeItem("isLoggedIn");
            sessionStorage.removeItem("showWelcome");
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("jobVaultResumeId");
            sessionStorage.removeItem("selectedResumeTemplate");

            window.location.href = "login.html";
        }

        // =========================
        // 10. LOAD SAVED RESUME
        // =========================
        loadResumeFromBackend();
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
