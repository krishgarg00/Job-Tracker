<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobVault - My Resumes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 90px;
            min-height: 100vh;
            background: #f7f8fa;
            color: #171717;
        }

        .navbar {
            min-height: 72px;
            background: #000 !important;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .page-container {
            max-width: 1150px;
            margin: auto;
            padding: 35px 20px 65px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 34px;
            font-weight: 750;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #777;
            margin: 0;
        }

        .btn-dark {
            border-radius: 8px;
            padding: 10px 18px;
        }

        .resume-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .resume-card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .035);
        }

        .resume-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .resume-icon {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #f0f0f0;
            font-size: 23px;
        }

        .resume-card h2 {
            font-size: 21px;
            font-weight: 700;
            overflow-wrap: anywhere;
            margin: 18px 0 8px;
        }

        .template-label {
            display: inline-block;
            background: #f2f2f2;
            color: #444;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
        }

        .resume-meta {
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }

        .resume-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 22px;
        }

        .resume-actions button {
            border-radius: 7px;
            padding: 8px 13px;
            font-size: 13px;
        }

        .empty-state,
        .loading-state {
            background: white;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 55px 20px;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 23px;
            font-weight: 700;
            margin: 12px 0;
        }

        .empty-icon {
            font-size: 42px;
        }

        .error-message {
            background: #fff0f0;
            color: #a00000;
            border-radius: 9px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .muted {
            color: #777;
        }

        footer {
            background: #000;
            color: white;
            padding: 30px 0;
            text-align: center;
        }

        footer p {
            color: #999;
            font-size: 13px;
            margin: 8px 0 0;
        }

        @media (max-width: 700px) {
            .resume-grid {
                grid-template-columns: 1fr;
            }

            .page-heading h1 {
                font-size: 28px;
            }

            .page-container {
                padding-top: 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">JobVault</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="home.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="applications.html">Applications</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active" href="my_resumes.html">My Resumes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="resume_builder.html">Resume Builder</a>
                    </li>
                </ul>

                <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <main class="page-container">
        <div class="page-heading">
            <div>
                <h1>My Resumes</h1>
                <p>Manage your saved resumes in one place.</p>
            </div>

            <button class="btn btn-dark" onclick="createNewResume()">
                + Create New Resume
            </button>
        </div>

        <div id="message"></div>

        <div id="loading" class="loading-state">
            Loading your resumes...
        </div>

        <div id="resumeGrid" class="resume-grid"></div>

        <div id="emptyState" class="empty-state" hidden>
            <div class="empty-icon">📄</div>
            <h2>No resumes yet</h2>
            <p class="muted">Create your first resume to get started.</p>
            <button class="btn btn-dark mt-3" onclick="createNewResume()">
                Create Resume
            </button>
        </div>
    </main>

    <footer>
        <div class="container">
            <strong>JobVault</strong>
            <p>Build your professional resume with JobVault.</p>
        </div>
    </footer>

    <script>
        const API_URL = "http://localhost:5000/api/resumes";

        const currentUser = JSON.parse(
            sessionStorage.getItem("currentUser") || "null"
        );

        const token = sessionStorage.getItem("token");

        let resumes = [];

        if (
            sessionStorage.getItem("isLoggedIn") !== "true" ||
            !currentUser ||
            !token
        ) {
            window.location.replace("login.html");
        } else {
            loadResumes();
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function showMessage(message, isError = true) {
            const box = document.getElementById("message");

            box.innerHTML = message
                ? `<div class="${isError ? "error-message" : "alert alert-success"}">
                   ${escapeHtml(message)}
               </div>`
                : "";
        }

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });

            let result = {};

            try {
                result = await response.json();
            } catch {
                // The API response may not contain JSON.
            }

            if (response.status === 401 || response.status === 403) {
                throw new Error("Your session may have expired. Please log in again.");
            }

            if (!response.ok) {
                throw new Error(result.message || "The request failed.");
            }

            return result;
        }

        async function loadResumes() {
            const loading = document.getElementById("loading");
            const grid = document.getElementById("resumeGrid");
            const empty = document.getElementById("emptyState");

            loading.hidden = false;
            grid.innerHTML = "";
            empty.hidden = true;
            showMessage("");

            try {
                const result = await apiRequest(API_URL);

                resumes = Array.isArray(result.resumes)
                    ? result.resumes
                    : [];

                loading.hidden = true;

                if (resumes.length === 0) {
                    empty.hidden = false;
                    return;
                }

                grid.innerHTML = resumes.map(resume => {
                    const name = resume.title || "My Resume";
                    const template = resume.template || "Template1";
                    const updatedAt = resume.updatedAt
                        ? new Date(resume.updatedAt).toLocaleDateString()
                        : "Not available";

                    return `
                    <article class="resume-card">
                        <div class="resume-card-top">
                            <div class="resume-icon" aria-hidden="true">📄</div>
                            <span class="template-label">
                                ${escapeHtml(template)}
                            </span>
                        </div>

                        <h2>${escapeHtml(name)}</h2>

                        <div class="muted">
                            ${escapeHtml(
                        resume.personalInfo?.fullName || "No name added"
                    )}
                        </div>

                        <div class="resume-meta">
                            Last updated: ${escapeHtml(updatedAt)}
                        </div>

                        <div class="resume-actions">
                            <button class="btn btn-dark"
                                onclick="editResume('${escapeHtml(resume._id)}')">
                                Edit
                            </button>

                            <button
    class="btn btn-outline-primary"
    onclick="previewResume(
        '${resume._id}',
        '${resume.template || "Template1"}'
    )"
>
    Preview
</button>

                            <button class="btn btn-outline-danger"
                                onclick="deleteResume('${escapeHtml(resume._id)}')">
                                Delete
                            </button>
                        </div>
                    </article>
                `;
                }).join("");

            } catch (error) {
                loading.hidden = true;
                showMessage(error.message);

                if (/session may have expired/i.test(error.message)) {
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                }
            }
        }

        function createNewResume() {
            sessionStorage.removeItem("jobVaultResumeId");
            sessionStorage.removeItem("selectedResumeTemplate");
            window.location.href = "resume_input.html";
        }

        function findResume(id) {
            return resumes.find(resume => resume._id === id);
        }

        function editResume(id) {
            if (!findResume(id)) {
                showMessage("Resume not found. Please refresh the page.");
                return;
            }

            sessionStorage.setItem("jobVaultResumeId", id);
            window.location.href = "resume_input.html";
        }

        async function previewResume(id) {
            const resume = findResume(id);

            if (!resume) {
                showMessage("Resume not found. Please refresh the page.");
                return;
            }

            /*
              Reuse the existing resume-input loader to map the saved
              MongoDB resume into the format expected by your templates.
              The user can then choose the saved template and preview it.
            */
            sessionStorage.setItem("jobVaultResumeId", id);
            sessionStorage.setItem(
                "selectedResumeTemplate",
                resume.template || "Template1"
            );

            window.location.href = "template.html";
        }

        async function deleteResume(id) {
            const resume = findResume(id);

            if (!resume) {
                showMessage("Resume not found. Please refresh the page.");
                return;
            }

            const confirmed = confirm(
                `Are you sure you want to delete "${resume.title || "My Resume"}"? This cannot be undone.`
            );

            if (!confirmed) return;

            try {
                await apiRequest(`${API_URL}/${encodeURIComponent(id)}`, {
                    method: "DELETE"
                });

                if (sessionStorage.getItem("jobVaultResumeId") === id) {
                    sessionStorage.removeItem("jobVaultResumeId");
                }

                showMessage("Resume deleted successfully.", false);
                await loadResumes();

            } catch (error) {
                showMessage(error.message);
            }
        }

        function handleLogout() {
            [
                "currentUser",
                "isLoggedIn",
                "showWelcome",
                "token",
                "jobVaultResumeId",
                "selectedResumeTemplate"
            ].forEach(key => sessionStorage.removeItem(key));

            window.location.href = "index.html";
        }

        function previewResume(resumeId, templateName) {
            sessionStorage.setItem("jobVaultResumeId", resumeId);
            sessionStorage.setItem(
                "selectedResumeTemplate",
                templateName || "Template1"
            );

            window.location.href = `${templateName || "Template1"}.html`;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
