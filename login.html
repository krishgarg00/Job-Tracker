<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobVault - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 72px;
        }

        main {
            flex: 1;
        }

        .navbar {
            height: 72px;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            background: #000 !important;
        }

        .navbar-brand {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-link {
            font-size: 14px;
            margin: 0 7px;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .navbar .btn {
            border-radius: 8px;
        }

        .login-card {
            border: none;
            border-radius: 15px;
        }

        .form-control {
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #000;
            box-shadow: 0 0 0 0.15rem rgba(0, 0, 0, 0.1);
        }

        .btn-dark {
            border-radius: 8px;
        }

        footer {
            background: #000;
            color: white;
            padding: 45px 0 25px;
        }

        .footer-brand {
            font-size: 20px;
            font-weight: 700;
        }

        .footer-text {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }

        .footer-link {
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            margin-left: 20px;
        }

        .footer-link:hover {
            color: white;
        }

        .copyright {
            color: #666;
            font-size: 12px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .footer-link {
                margin-left: 0;
                margin-right: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    JobVault
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">

                    <ul class="navbar-nav mx-auto">

                        <li class="nav-item">
                            <a class="nav-link text-white" href="index.html">
                                Home
                            </a>
                        </li>

                    </ul>

                    <div class="d-flex">
                        <a href="signup.html" class="btn btn-light btn-sm px-3">
                            Sign Up
                        </a>
                    </div>

                </div>

            </div>
        </nav>
    </header>

    <main>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                    <div class="card login-card shadow-sm p-4">

                        <h2 class="text-center fw-bold mb-2">
                            Welcome Back
                        </h2>

                        <p class="text-center text-secondary mb-4">
                            Login to manage your job applications
                        </p>

                        <form onsubmit="handleLogin(event)">

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email" id="email" required class="form-control"
                                    placeholder="Enter your email">

                            </div>

                            <div class="mb-4">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" id="password" required class="form-control"
                                    placeholder="Enter your password">

                            </div>

                            <button type="submit" class="btn btn-dark w-100">
                                Login
                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            Don't have an account?

                            <a href="signup.html" class="text-dark fw-semibold text-decoration-none">
                                Sign Up
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer>

        <div class="container">

            <div class="d-flex justify-content-between align-items-center flex-wrap">

                <div>

                    <div class="footer-brand">
                        JobVault
                    </div>

                    <div class="footer-text">
                        Track your applications. Manage your career.
                    </div>

                </div>

                <div class="mt-3 mt-md-0">

                    <a href="index.html#features" class="footer-link">
                        Features
                    </a>

                    <a href="index.html#how" class="footer-link">
                        How It Works
                    </a>

                    <a href="index.html#tracker" class="footer-link">
                        Job Tracker
                    </a>

                    <a href="signup.html" class="footer-link">
                        Sign Up
                    </a>

                </div>

            </div>

            <div class="copyright">
                © 2026 JobVault. All rights reserved.
            </div>

        </div>

    </footer>

    <script>
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const API_URL = "http://localhost:5000/api/auth";

        const handleLogin = async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                alert("Please enter your email and password.");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Login failed.");
                }

                // Save the JWT and logged-in user's details
                sessionStorage.setItem("token", result.token);
                sessionStorage.setItem("currentUser", JSON.stringify(result.user));
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("showWelcome", "true");

                window.location.href = "home.html";

            } catch (error) {
                console.error("Login error:", error);
                alert(
                    error.message ||
                    "Unable to log in. Please check that the backend is running."
                );
            }
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
